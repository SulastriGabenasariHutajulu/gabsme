<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GabsShop — Beauty, Style &amp; Adventure</title>
<meta name="description" content="Kurasi produk beauty, OOTD, dan outdoor yang benar-benar dipakai — dari sunscreen reef-safe sampai gear hiking & diving.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #7EC8F2;
    --blue-light: #D6EEFC;
    --blue-soft: #EEF8FF;
    --blue-deep: #2E8BD0;
    --pink: #F6A9C6;
    --pink-deep: #E0699A;
    --pink-soft: #FFE9F1;
    --bg: #F3FAFF;
    --surface: #FFFFFF;
    --surface2: #E6F4FD;
    --border: rgba(126,200,242,0.45);
    --text: #2B3A55;
    --muted: #7C8BA3;
    --radius: 22px;
    --shadow: 0 10px 34px rgba(80,160,220,0.16);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 16px 40px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 24px; font-weight: 700; font-style: italic;
    letter-spacing: 0.02em;
    color: var(--blue-deep);
  }
  .logo span { color: var(--pink-deep); }
  .nav-tagline {
    font-size: 12px; color: var(--muted);
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  .nav-badge {
    font-size: 11px; color: var(--pink-deep);
    background: var(--pink-soft);
    border: 1px solid var(--pink);
    padding: 5px 14px; border-radius: 20px;
    letter-spacing: 0.08em;
  }

  /* ── HERO ── */
  .hero {
    min-height: 92vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 130px 24px 80px;
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, #BFE5FA 0%, #DDF1FD 45%, var(--bg) 100%);
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 28% 14% at 15% 22%, rgba(255,255,255,0.95) 0%, transparent 70%),
      radial-gradient(ellipse 22% 11% at 82% 16%, rgba(255,255,255,0.9) 0%, transparent 70%),
      radial-gradient(ellipse 30% 13% at 78% 68%, rgba(255,255,255,0.75) 0%, transparent 70%),
      radial-gradient(ellipse 26% 12% at 10% 75%, rgba(255,255,255,0.8) 0%, transparent 70%),
      radial-gradient(ellipse 40% 25% at 50% 100%, rgba(246,169,198,0.22) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero > * { position: relative; }

  .hero-eyebrow {
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--pink-deep); margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .hero-eyebrow::before, .hero-eyebrow::after {
    content: '♡'; display: block; font-size: 12px; color: var(--pink);
  }

  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(42px, 7vw, 78px);
    font-weight: 700; line-height: 1.12;
    max-width: 820px;
    color: var(--text);
  }
  .hero h1 em {
    font-style: italic;
    background: linear-gradient(135deg, #4FB0EC 0%, #A78BDA 55%, #F08CB4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-sub {
    margin-top: 20px; max-width: 520px;
    font-size: 16px; color: #5E6E88; line-height: 1.7;
  }

  .hero-cta {
    margin-top: 40px;
    display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
  }
  .btn-primary {
    padding: 14px 34px; border-radius: 50px;
    background: linear-gradient(135deg, #4FB0EC, var(--blue-deep));
    color: #fff; font-weight: 600; font-size: 14px;
    border: none; cursor: pointer; text-decoration: none;
    letter-spacing: 0.04em; transition: all 0.2s;
    box-shadow: 0 8px 20px rgba(46,139,208,0.28);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(46,139,208,0.36); }
  .btn-outline {
    padding: 14px 34px; border-radius: 50px;
    background: rgba(255,255,255,0.7);
    color: var(--pink-deep); font-weight: 500; font-size: 14px;
    border: 1.5px solid var(--pink); cursor: pointer; text-decoration: none;
    letter-spacing: 0.04em; transition: all 0.2s;
  }
  .btn-outline:hover { background: var(--pink-soft); transform: translateY(-2px); }

  .hero-stats {
    margin-top: 56px;
    display: flex; gap: 48px; justify-content: center; flex-wrap: wrap;
  }
  .stat { text-align: center; }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 28px; font-weight: 600; color: var(--blue-deep);
  }
  .stat-label {
    font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: 0.08em;
  }

  /* ── FILTER ── */
  .filter-section {
    padding: 60px 40px 16px;
    max-width: 1200px; margin: 0 auto;
  }
  .section-label {
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--pink-deep); margin-bottom: 16px; font-weight: 600;
  }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; }
  .filter-btn {
    padding: 9px 22px; border-radius: 50px; font-size: 13px;
    border: 1px solid var(--border);
    background: var(--surface); color: var(--muted);
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--pink);
    color: var(--pink-deep); background: var(--pink-soft);
  }

  /* ── SEARCH ── */
  .search-wrap {
    padding: 0 40px 32px;
    max-width: 1200px; margin: 0 auto;
  }
  .search-box { position: relative; max-width: 360px; }
